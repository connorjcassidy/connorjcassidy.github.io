<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Connor Cassidy</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #60a5fa;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(135deg, var(--bg), #1e293b);
        color: var(--text);
      }

      .card {
        width: min(90vw, 700px);
        background: rgba(17, 24, 39, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 18px;
        padding: 3rem 2rem;
        box-shadow: 0 20px 45px rgba(0, 0, 0, 0.35);
        text-align: center;
      }

      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 5vw, 3.5rem);
      }

      p {
        margin: 0.75rem 0;
        color: var(--muted);
        line-height: 1.6;
        font-size: 1.05rem;
      }

      .tag {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.6rem 1rem;
        border-radius: 999px;
        background: rgba(96, 165, 250, 0.12);
        color: var(--accent);
        border: 1px solid rgba(96, 165, 250, 0.35);
        font-weight: bold;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Connor Cassidy</h1>
      <p>Welcome to my personal website.</p>
      <p>This site is currently being set up.</p>
      <div class="tag">GitHub Pages</div>
    </main>
  </body>
</html>
